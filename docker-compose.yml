# One service per tool pack.
#
#   docker compose up --build seurat    then open http://localhost:8000
#   docker compose up --build signac    then open http://localhost:8001
#
# The Signac image is built on the R base of the Seurat one (the r-base
# service below, which Compose builds first), so engine and web updates don't
# rebuild its R packages, data or reference. It is optional: it only builds
# when you name it.
#
# The ports are bound to 127.0.0.1 on purpose: the game runs the code you
# type, so it should only be reachable from your own machine.
#
# Optional chats ("consult another doctor", "talk to the patient"): put one of
# these in a file called .env next to this one, then run
# `docker compose up -d seurat` (or signac) again. .env is gitignored. See the
# README's "Consult another doctor" section for what each costs.
#   CLAUDE_CODE_OAUTH_TOKEN=...   your Claude Pro/Max/Team plan (claude setup-token)
#   GEMINI_API_KEY=...            Gemini, free tier available
#   OPENAI_API_KEY=...            ChatGPT, pay per use
#   ANTHROPIC_API_KEY=...         Claude, pay per use
#   CURELAB_CONSULT_BASE_URL=...  any OpenAI-compatible service (+ CURELAB_CONSULT_MODEL)

# Passed to both games (empty = not set).
x-chat-env: &chat-env
  CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CURELAB_CONSULT_BASE_URL: ${CURELAB_CONSULT_BASE_URL:-}
  CURELAB_CONSULT_API_KEY: ${CURELAB_CONSULT_API_KEY:-}
  CURELAB_CONSULT_PROVIDER: ${CURELAB_CONSULT_PROVIDER:-}
  CURELAB_CONSULT_MODEL: ${CURELAB_CONSULT_MODEL:-}
  CURELAB_BEDSIDE_MODEL: ${CURELAB_BEDSIDE_MODEL:-}

services:
  seurat:
    build:
      context: .
      dockerfile: packs/seurat/Dockerfile
    image: curelab-seurat:latest
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - curelab-seurat-data:/data   # saves and lab notebooks survive restarts
    environment:
      # Set to 1 to open later campaigns without winning Campaign 1 first.
      CURELAB_UNLOCK_ALL: "0"
      <<: *chat-env
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach an Ollama on this computer
    restart: unless-stopped

  # R, Seurat, Python and the Jupyter R kernel: the first stage of the Seurat
  # image, tagged for the Signac image to build on. Built, never started.
  r-base:
    build:
      context: .
      dockerfile: packs/seurat/Dockerfile
      target: r-base
    image: curelab-r-base:latest
    scale: 0

  signac:
    profiles: [signac]             # only built/started when named
    build:
      context: .
      dockerfile: packs/signac/Dockerfile
      additional_contexts:
        curelab-r-base: service:r-base   # FROM curelab-r-base = the stage above
    image: curelab-signac:latest
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - curelab-signac-data:/data
    environment:
      CURELAB_UNLOCK_ALL: "0"
      <<: *chat-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  curelab-seurat-data:
  curelab-signac-data:
