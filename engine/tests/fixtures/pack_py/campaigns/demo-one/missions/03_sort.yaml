id: demo-m03-sort
title: Rank the counts
points: 30
source:
  vignette: datastructures.rst
  section: More on Lists
briefing: Sort the counts.
task:
  - Store the counts sorted ascending in `ranked`.
setup: |
  counts = [3, 1, 4]
solution: |
  ranked = sorted(counts)
check: |
  def _check():
      if globals().get("ranked") != [1, 3, 4]:
          curelab_fail("ranked should be [1, 3, 4].")
  curelab_check(_check)
hints:
  - There is a built-in that returns a new sorted list.
  - Use `sorted()`.
  - "`ranked = sorted(counts)`"
