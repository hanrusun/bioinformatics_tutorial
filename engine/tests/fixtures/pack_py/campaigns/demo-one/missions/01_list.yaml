id: demo-m01-list
title: Collect the samples
points: 30
source:
  vignette: datastructures.rst
  section: More on Lists
  quote: The list data type has some more methods.
briefing: |
  {name}'s first samples are in. Store the three counts in a list.
task:
  - Create a list called `counts` holding 3, 1 and 4 (in that order).
starter_code: |
  counts = 
solution: |
  counts = [3, 1, 4]
check: |
  def _check():
      if "counts" not in globals():
          curelab_fail("There is no variable called counts yet.")
      if counts != [3, 1, 4]:
          curelab_fail(f"counts should be [3, 1, 4], not {counts!r}.")
  curelab_check(_check)
hints:
  - Lists are written with square brackets.
  - "Use `counts = [...]` with the three numbers separated by commas."
  - "`counts = [3, 1, 4]`"
debug:
  - pattern: counts should be
    help: The list exists but holds the wrong values. Check the order.
notebook_pages: [demo-nb01]
state: [counts]
expected:
  n: len(counts)
wrong_solutions:
  - code: counts = [1, 3, 4]
    why: wrong order
