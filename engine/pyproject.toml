[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curelab"
version = "0.1.0"
description = "Cure Lab: a tool-agnostic engine for gamified bioinformatics tutorials"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6",
  "jupyter_client>=8.6",
  "pyzmq>=25",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ipykernel>=6.29"]

[project.scripts]
curelab = "curelab.__main__:main"

[tool.setuptools.packages.find]
include = ["curelab*"]

[tool.setuptools.package-data]
curelab = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
