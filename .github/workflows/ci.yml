name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine, balance and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install -e "engine[test]"
      - name: Unit and API tests (real Jupyter kernel via ipykernel)
        run: pytest -q engine/tests
      - name: Balance targets
        run: python tools/simulate_balance.py --assert -n 300
      - name: Every quote and solution line is verbatim in the pinned Seurat vignettes
        run: python tools/verify_sources.py
      - name: docs/SOURCES.md is up to date
        run: git diff --exit-code docs/SOURCES.md

  rcheck:
    name: R snippets (parse + helper unit tests, webR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e engine
      - working-directory: tools/rcheck
        run: npm install --no-audit --no-fund && npm test

  web:
    name: Web UI (typecheck, unit tests, build, end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e "engine[test]"
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - working-directory: web
        run: npm run typecheck && npm test && npm run build
      - working-directory: web
        run: npx playwright install --with-deps chromium && npm run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: web/test-results
          if-no-files-found: ignore

  docker:
    name: Seurat image (downloads data, runs every reference solution and check)
    needs: [engine, rcheck, web]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the ~5 GB image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - name: Build (fails if any mission check misbehaves)
        run: docker build -f packs/seurat/Dockerfile -t curelab-seurat:ci .
      - name: Smoke test the running game
        run: |
          docker run -d --name curelab -p 127.0.0.1:8000:8000 curelab-seurat:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/meta | python3 -c "import sys, json; m = json.load(sys.stdin); assert [c['id'] for c in m['campaigns']] == ['c1-basics', 'c2-multiome']"
          curl -fsS -X POST http://127.0.0.1:8000/api/game/start -H 'content-type: application/json' -d '{"campaign": "c1-basics", "difficulty": "normal", "seed": 1}' > /dev/null
          curl -fsS -X POST http://127.0.0.1:8000/api/missions/c1-m01-load/start | python3 -c "import sys, json; assert json.load(sys.stdin)['ok']"
          python3 - <<'EOF'
          import json, urllib.request
          sol = 'library(dplyr)\nlibrary(Seurat)\nlibrary(patchwork)\npbmc.data <- Read10X(data.dir = "/opt/curelab/datasets/pbmc3k/filtered_gene_bc_matrices/hg19/")\npbmc <- CreateSeuratObject(counts = pbmc.data, project = "pbmc3k", min.cells = 3, min.features = 200)\n'
          req = urllib.request.Request("http://127.0.0.1:8000/api/missions/c1-m01-load/submit",
                                       data=json.dumps({"code": sol}).encode(), headers={"content-type": "application/json"})
          out = json.load(urllib.request.urlopen(req, timeout=600))
          print(out["outcome"]["message"])
          assert out["outcome"]["passed"], out["outcome"]
          assert out["game"]["research"] == 6
          EOF
      - if: always()
        run: docker logs curelab || true
