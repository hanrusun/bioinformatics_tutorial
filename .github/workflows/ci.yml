name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine, balance and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install -e "engine[test]"
      - name: Unit and API tests (real Jupyter kernel via ipykernel)
        run: pytest -q engine/tests
      - name: Balance targets
        run: python tools/simulate_balance.py --assert -n 300
      - name: Every quote and solution line is verbatim in the pinned Seurat vignettes
        run: python tools/verify_sources.py
      - name: Same for the Signac pack (Signac and Seurat vignettes)
        run: python tools/verify_sources.py --pack packs/signac
      - name: docs/SOURCES.md and docs/SOURCES-signac.md are up to date
        run: git diff --exit-code docs/SOURCES.md docs/SOURCES-signac.md

  rcheck:
    name: R snippets (parse + helper unit tests, webR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e engine
      - working-directory: tools/rcheck
        run: npm install --no-audit --no-fund && npm test

  web:
    name: Web UI (typecheck, unit tests, build, end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e "engine[test]"
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - working-directory: web
        run: npm run typecheck && npm test && npm run build
      - working-directory: web
        run: npx playwright install --with-deps chromium && npm run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: web/test-results
          if-no-files-found: ignore

  docker:
    name: Seurat and Signac images (download data, run every reference solution and check)
    needs: [engine, rcheck, web]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the images (~9 GB Seurat, Signac on top)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
          docker system prune -af
          df -h / /mnt
      - name: Add swap (the reference builds hold whole datasets in memory)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /mnt/curelab.swap
          sudo chmod 600 /mnt/curelab.swap
          sudo mkswap /mnt/curelab.swap
          sudo swapon /mnt/curelab.swap
          free -h
      - name: Build (fails if any mission check misbehaves)
        run: docker build -f packs/seurat/Dockerfile -t curelab-seurat:ci .
      - name: Image size
        run: |
          docker image ls curelab-seurat:ci
          docker run --rm --entrypoint du curelab-seurat:ci -sh /opt/curelab/datasets /usr/local/lib/R/site-library \
            /opt/curelab/reference/checkpoints /opt/curelab/reference/checkpoints/blobs
      - name: Smoke test the running game
        run: |
          docker run -d --name curelab -e CURELAB_UNLOCK_ALL=1 -p 127.0.0.1:8000:8000 curelab-seurat:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/meta | python3 -c "import sys, json; m = json.load(sys.stdin); assert [c['id'] for c in m['campaigns']] == ['c1-basics', 'c2-multiome', 'c3-crispr']"
          curl -fsS -X POST http://127.0.0.1:8000/api/game/start -H 'content-type: application/json' -d '{"campaign": "c1-basics", "difficulty": "normal", "seed": 1}' > /dev/null
          curl -fsS -X POST http://127.0.0.1:8000/api/missions/c1-m01-load/start | python3 -c "import sys, json; assert json.load(sys.stdin)['ok']"
          python3 - <<'EOF'
          import json, urllib.request
          sol = 'library(dplyr)\nlibrary(Seurat)\nlibrary(patchwork)\npbmc.data <- Read10X(data.dir = "/opt/curelab/datasets/pbmc3k/filtered_gene_bc_matrices/hg19/")\npbmc <- CreateSeuratObject(counts = pbmc.data, project = "pbmc3k", min.cells = 3, min.features = 200)\n'
          req = urllib.request.Request("http://127.0.0.1:8000/api/missions/c1-m01-load/submit",
                                       data=json.dumps({"code": sol}).encode(), headers={"content-type": "application/json"})
          out = json.load(urllib.request.urlopen(req, timeout=600))
          print(out["outcome"]["message"])
          assert out["outcome"]["passed"], out["outcome"]
          assert out["game"]["research"] == 6
          EOF
          # Campaign 3 (Mixscape): its first mission loads the THP-1 screen
          curl -fsS -X POST http://127.0.0.1:8000/api/game/start -H 'content-type: application/json' -d '{"campaign": "c3-crispr", "difficulty": "normal", "seed": 1}' > /dev/null
          curl -fsS -X POST http://127.0.0.1:8000/api/missions/c3-m01-load/start | python3 -c "import sys, json; assert json.load(sys.stdin)['ok']"
          python3 - <<'EOF'
          import json, urllib.request
          sol = 'eccite <- LoadData(ds = "thp1.eccite")\neccite <- NormalizeData(object = eccite, assay = "ADT", normalization.method = "CLR", margin = 2)\n'
          req = urllib.request.Request("http://127.0.0.1:8000/api/missions/c3-m01-load/submit",
                                       data=json.dumps({"code": sol}).encode(), headers={"content-type": "application/json"})
          out = json.load(urllib.request.urlopen(req, timeout=600))
          print(out["outcome"]["message"])
          assert out["outcome"]["passed"], out["outcome"]
          assert out["game"]["research"] == 7
          EOF
      - if: always()
        run: docker logs curelab || true
      - name: Stop the Seurat game
        if: always()
        run: docker rm -f curelab || true

      # The Signac image is built FROM the Seurat image above.
      - name: Build the Signac image (fails if any mission check misbehaves)
        run: |
          docker builder prune -af
          df -h /
          docker build -f packs/signac/Dockerfile --build-arg SEURAT_IMAGE=curelab-seurat:ci -t curelab-signac:ci .
      - name: Signac image size
        run: |
          docker image ls 'curelab-*'
          docker history --format '{{.Size}}\t{{.CreatedBy}}' curelab-signac:ci | head -n 12 | cut -c1-160
          docker run --rm --entrypoint du curelab-signac:ci -sh /opt/curelab/datasets/pbmc_multiome_10k \
            /opt/curelab/reference-signac/checkpoints /opt/curelab/reference-signac/checkpoints/blobs
          docker run --rm --entrypoint cat curelab-signac:ci /opt/curelab/reference-signac/memory.tsv
      - name: Smoke test the Signac game
        run: |
          docker run -d --name curelab-signac -p 127.0.0.1:8001:8000 curelab-signac:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8001/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8001/api/meta | python3 -c "import sys, json; m = json.load(sys.stdin); assert [c['id'] for c in m['campaigns']] == ['s1-multiome'], m['campaigns']"
          curl -fsS -X POST http://127.0.0.1:8001/api/game/start -H 'content-type: application/json' -d '{"campaign": "s1-multiome", "difficulty": "normal", "seed": 1}' > /dev/null
          curl -fsS -X POST http://127.0.0.1:8001/api/missions/s1-m01-build/start | python3 -c "import sys, json; assert json.load(sys.stdin)['ok']"
          # submit the mission's own reference solution, read from the pack in the image
          docker exec curelab-signac /opt/curelab/venv/bin/python -c "import json, yaml; print(json.dumps({'code': yaml.safe_load(open('/opt/curelab/app/packs/signac/campaigns/s1-multiome/missions/01_build.yaml'))['solution']}))" > s1-m01.json
          curl -fsS --max-time 900 -X POST http://127.0.0.1:8001/api/missions/s1-m01-build/submit -H 'content-type: application/json' -d @s1-m01.json \
            | python3 -c "import sys, json; out = json.load(sys.stdin); print(out['outcome']['message']); assert out['outcome']['passed'], out['outcome']; assert out['game']['research'] == 11"
      - if: always()
        run: docker logs curelab-signac || true
