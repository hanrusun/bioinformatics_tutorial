id: c1-nb03-normalize
title: Normalization
rp: 1
missions: [c1-m04-normalize]
blocks:
  - quote: >-
      After removing unwanted cells from the dataset, the next step is to
      normalize the data. By default, we employ a global-scaling normalization
      method "LogNormalize" that normalizes the feature expression measurements
      for each cell by the total expression, multiplies this by a scale factor
      (10,000 by default), and log-transforms the result. In Seurat v5,
      normalized values are stored in `pbmc[["RNA"]]$data`.
    source: {vignette: pbmc3k_tutorial.Rmd, section: "Normalizing the data"}
  - code: |
      pbmc <- NormalizeData(pbmc, normalization.method = "LogNormalize", scale.factor = 1e4)
    source: {vignette: pbmc3k_tutorial.Rmd, section: "Normalizing the data"}
  - quote: >-
      While this method of normalization is standard and widely used in
      scRNA-seq analysis, global-scaling relies on an assumption that each cell
      originally contains the same number of RNA molecules.
    source: {vignette: pbmc3k_tutorial.Rmd, section: "Normalizing the data"}
  - text: >-
      The NBL pipeline scripts call `NormalizeData()` with
      `normalization.method = 'LogNormalize'` too, sometimes with a
      dataset-specific `scale.factor` (the median counts per cell).
