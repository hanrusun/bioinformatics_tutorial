id: s1-nb05-coverage-links
title: Coverage plots and peak-gene links
rp: 2
missions: [s1-m08-coverage, s1-m09-links]
blocks:
  - quote: >-
      For example, the ATAC-seq data assists in the separation of CD4 and CD8 T
      cell states. This is due to the presence of multiple loci that exhibit
      differential accessibility between different T cell subtypes.
    source: {vignette: "seurat:weighted_nearest_neighbor_analysis.Rmd", section: "WNN analysis of 10x Multiome, RNA + ATAC"}
  - code: |
      ## to make the visualization easier, subset T cell clusters
      celltype.names <- levels(pbmc)
      tcell.names <- grep("CD4|CD8|Treg", celltype.names,value = TRUE)
      tcells <- subset(pbmc, idents = tcell.names)
      CoveragePlot(tcells, region = 'CD8A', features = 'CD8A', assay = 'ATAC', expression.assay = 'SCT', peaks = FALSE)
    source: {vignette: "seurat:weighted_nearest_neighbor_analysis.Rmd", section: "WNN analysis of 10x Multiome, RNA + ATAC"}
  - quote: >-
      For each gene, we can find the set of peaks that may regulate the gene by
      by computing the correlation between gene expression and accessibility at
      nearby peaks, and correcting for bias due to GC content, overall
      accessibility, and peak size.
    source: {vignette: pbmc_multiomic.Rmd, section: "Linking peaks to genes"}
  - quote: >-
      Running this step on the whole genome can be time consuming, so here we
      demonstrate peak-gene links for a subset of genes as an example.
    source: {vignette: pbmc_multiomic.Rmd, section: "Linking peaks to genes"}
  - code: |
      DefaultAssay(pbmc) <- "ATAC"

      # first compute the GC content for each peak
      pbmc <- RegionStats(pbmc, genome = BSgenome.Hsapiens.UCSC.hg38)

      # link peaks to genes
      pbmc <- LinkPeaks(
        object = pbmc,
        peak.assay = "ATAC",
        expression.assay = "SCT",
        genes.use = c("LYZ", "MS4A1")
      )
    source: {vignette: pbmc_multiomic.Rmd, section: "Linking peaks to genes"}
