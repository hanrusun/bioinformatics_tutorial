      Idents(pbmc) <- "sub.cluster"
      pbmc <- RenameIdents(pbmc, '0' = 'CD14 Mono', '9' ='CD14 Mono', '5' = 'CD16 Mono')
      pbmc$celltype <- Idents(pbmc)
