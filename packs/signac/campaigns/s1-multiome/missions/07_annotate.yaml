id: s1-m07-annotate
title: Naming the cell types
points: 6
source:
  vignette: seurat:weighted_nearest_neighbor_analysis.Rmd
  section: WNN analysis of 10x Multiome, RNA + ATAC
  quote: >-
    We annotate the clusters below.
briefing: |
  Give the WNN clusters their cell-type names, as the vignette does: first
  split cluster 6, which mixes several T-cell states, into sub-clusters, then
  rename every cluster and sub-cluster. Store the names in a `celltype`
  column; every later mission uses it.

  A vignette's cluster numbers only hold for its own run: they shift with
  package versions (Signac 1.17, for one, computes the LSI with a different
  SVD routine than earlier releases). In this lab's build, clusters 8, 9 and
  11 came out in a different order than in the vignette: 8 expresses CD14
  and LYZ (monocytes), 9 expresses MS4A1, IGHD and TCL1A (B cells) and 11
  expresses CCR7, CD3E and CD8A (naive CD8 T cells). The starter code's
  RenameIdents() lines are adapted for those three; everything else is the
  vignette's. Check each cluster's markers before you trust a name.
task:
  - Sub-cluster cluster 6 on the "wsnn" graph (SLM, `algorithm = 3`) and use the sub-clusters as identities.
  - Rename every cluster with the vignette's cell-type labels (clusters 8, 9 and 11 adapted to this build).
  - Save the identities as `pbmc$celltype`.
setup: |
  curelab_libraries(c("Signac", "EnsDb.Hsapiens.v86", "ggplot2", "GenomeInfoDb"))
  load_checkpoint("s1-m06-wnn")
starter_code: |
  # perform sub-clustering on cluster 6 to find additional structure
  pbmc <- FindSubCluster(pbmc, cluster = 6, graph.name = "wsnn", algorithm = 3)
  Idents(pbmc) <- "sub.cluster"

  # add annotations
  pbmc <- RenameIdents(pbmc, '19' = 'pDC','20' = 'HSPC','15' = 'cDC')
  # clusters 8, 9 and 11 adapted to this build's numbering (see the briefing)
  pbmc <- RenameIdents(pbmc, '0' = 'CD14 Mono', '8' ='CD14 Mono', '5' = 'CD16 Mono')
  pbmc <- RenameIdents(pbmc, '10' = 'Naive B', '9' = 'Intermediate B', '17' = 'Memory B', '21' = 'Plasma')
  pbmc <- RenameIdents(pbmc, '7' = 'NK')
  pbmc <- RenameIdents(pbmc, '4' = 'CD4 TCM', '13'= "CD4 TEM", '3' = "CD4 TCM", '16' ="Treg", '1' ="CD4 Naive", '14' = "CD4 Naive")
  pbmc <- RenameIdents(pbmc, '2' = 'CD8 Naive', '11'= "CD8 Naive", '12' = 'CD8 TEM_1', '6_0' = 'CD8 TEM_2', '6_1' ='CD8 TEM_2', '6_4' ='CD8 TEM_2')
  pbmc <- RenameIdents(pbmc, '18' = 'MAIT')
  pbmc <- RenameIdents(pbmc, '6_2' ='gdT', '6_3' = 'gdT')
  pbmc$celltype <-

  DimPlot(pbmc, reduction = "wnn.umap", group.by = "celltype", label = TRUE, label.size = 2.5, repel = TRUE)
solution: |
  pbmc <- FindSubCluster(pbmc, cluster = 6, graph.name = "wsnn", algorithm = 3)
  Idents(pbmc) <- "sub.cluster"
  pbmc <- RenameIdents(pbmc, '19' = 'pDC','20' = 'HSPC','15' = 'cDC')
  pbmc <- RenameIdents(pbmc, '0' = 'CD14 Mono', '8' ='CD14 Mono', '5' = 'CD16 Mono') # curelab: adapted
  pbmc <- RenameIdents(pbmc, '10' = 'Naive B', '9' = 'Intermediate B', '17' = 'Memory B', '21' = 'Plasma') # curelab: adapted
  pbmc <- RenameIdents(pbmc, '7' = 'NK')
  pbmc <- RenameIdents(pbmc, '4' = 'CD4 TCM', '13'= "CD4 TEM", '3' = "CD4 TCM", '16' ="Treg", '1' ="CD4 Naive", '14' = "CD4 Naive")
  pbmc <- RenameIdents(pbmc, '2' = 'CD8 Naive', '11'= "CD8 Naive", '12' = 'CD8 TEM_1', '6_0' = 'CD8 TEM_2', '6_1' ='CD8 TEM_2', '6_4' ='CD8 TEM_2') # curelab: adapted
  pbmc <- RenameIdents(pbmc, '18' = 'MAIT')
  pbmc <- RenameIdents(pbmc, '6_2' ='gdT', '6_3' = 'gdT')
  pbmc$celltype <- Idents(pbmc)
check: |
  curelab_check({
    obj <- curelab_obj("pbmc", "Seurat")
    expect_true("sub.cluster" %in% colnames(obj[[]]),
      "Split cluster 6 first: FindSubCluster(pbmc, cluster = 6, graph.name = \"wsnn\", algorithm = 3).")
    expect_true("celltype" %in% colnames(obj[[]]), "Store the labels: pbmc$celltype <- Idents(pbmc).")
    expect_true(identical(as.character(obj$celltype), as.character(Idents(obj))),
      "`celltype` should hold the renamed identities: pbmc$celltype <- Idents(pbmc).")
    expect_equal_ref(sort(unique(as.character(obj$celltype))), "celltypes",
      "The cell-type labels don't match the reference annotation. Run every RenameIdents() line.", show = FALSE)
    lab <- tapply(as.character(obj$celltype), obj$sub.cluster, function(v) v[1])
    expect_equal_ref(paste(names(lab), lab, sep = "="), "cluster_labels",
      "Some clusters got a different name than in the reference annotation. Run every RenameIdents() line as given (clusters 8, 9 and 11 are adapted to this build).",
      show = FALSE)
    # every cluster's name has to fit what its cells express, not just match
    lineages <- list(
      myeloid = list(labels = c("CD14 Mono", "CD16 Mono", "cDC"), genes = c("LYZ", "CD14")),
      B = list(labels = c("Naive B", "Intermediate B", "Memory B"), genes = c("MS4A1", "IGHD")),
      "T or NK" = list(labels = c("CD4 Naive", "CD4 TCM", "CD4 TEM", "Treg", "CD8 Naive", "CD8 TEM_1",
        "CD8 TEM_2", "MAIT", "gdT", "NK"), genes = c("CD3E", "IL7R", "NKG7", "GNLY")),
      pDC = list(labels = "pDC", genes = c("LILRA4", "CLEC4C")),
      plasma = list(labels = "Plasma", genes = c("JCHAIN", "MZB1")),
      HSPC = list(labels = "HSPC", genes = "CD34")
    )
    fit <- curelab_label_fit(LayerData(obj, assay = "SCT", layer = "data"), obj$sub.cluster, obj$celltype, lineages)
    expect_true(!nrow(fit), paste0("Some names don't fit what the cells express: ",
      paste0("cluster ", fit$cluster, " is called '", fit$label, "' but looks like ", fit$looks_like, collapse = "; "), "."))
  })
expected:
  celltypes: sort(unique(as.character(pbmc$celltype)))
  cluster_labels: local({ lab <- tapply(as.character(pbmc$celltype), pbmc$sub.cluster, function(v) v[1]); paste(names(lab), lab, sep = "=") })
# Build log only: the vignette's RenameIdents() lines name clusters by number,
# so print what each (sub)cluster actually expresses in this build.
build_report: |
  panel <- c("CD14", "LYZ", "FCGR3A", "MS4A1", "TCL1A", "IGHD", "CD27", "JCHAIN", "MZB1",
    "LILRA4", "CLEC4C", "FCER1A", "CD1C", "CD34", "NKG7", "GNLY", "KLRF1", "CD3E", "CD4",
    "CD8A", "CCR7", "SELL", "IL7R", "GZMK", "GZMH", "FOXP3", "SLC4A10", "TRDC", "PPBP", "HBB")
  panel <- intersect(panel, rownames(pbmc[["SCT"]]))
  x <- LayerData(pbmc, assay = "SCT", layer = "data")[panel, ]
  groups <- split(seq_len(ncol(pbmc)), pbmc$sub.cluster)
  avg <- sapply(groups, function(i) Matrix::rowMeans(x[, i, drop = FALSE]))
  z <- t(scale(t(avg)))
  top <- apply(z, 2, function(v) paste(names(sort(v, decreasing = TRUE))[1:4], collapse = " "))
  label <- sapply(groups, function(i) as.character(pbmc$celltype[i[1]]))
  ord <- names(groups)[order(suppressWarnings(as.numeric(sub("_", ".", names(groups)))))]
  print(data.frame(cluster = ord, cells = lengths(groups)[ord], label = label[ord], top_markers = top[ord]), row.names = FALSE)
hints:
  - FindSubCluster adds a `sub.cluster` column; make it the identities, then rename cluster numbers to cell types.
  - "The starter code already has every `RenameIdents()` line (the vignette's, with clusters 8, 9 and 11 adapted to this build); add the sub-clustering and end with `pbmc$celltype <- Idents(pbmc)`."
  - |
    ```r
    pbmc <- FindSubCluster(pbmc, cluster = 6, graph.name = "wsnn", algorithm = 3)
    Idents(pbmc) <- "sub.cluster"
    # ... the RenameIdents() lines ...
    pbmc$celltype <- Idents(pbmc)
    ```
debug:
  - pattern: "Cannot find identity"
    help: A cluster number in RenameIdents() doesn't exist in `Idents(pbmc)`. Did you set `Idents(pbmc) <- "sub.cluster"` after FindSubCluster()?
notebook_pages: [s1-nb04-wnn]
state: [pbmc]
timeout: 1200
